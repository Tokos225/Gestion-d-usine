<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion — Gestion d'usine</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef1f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .carte { background: #fff; padding: 28px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.12); width: 350px; }
        h2 { margin-top: 0; color: #1b263b; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { width: 100%; margin-top: 18px; padding: 10px; background: #1b263b; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
        .erreur { color: #b00020; margin-top: 10px; }
        .lien-bas { margin-top: 16px; text-align: center; font-size: 14px; }
        .lien-bas a { color: #1565c0; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <div class="carte">
        <h2>Connexion</h2>
        <p>Entrez vos identifiants pour accéder à votre espace de travail.</p>
        {% if erreur %}<p class="erreur">{{ erreur }}</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <label>Identifiant</label>
            <input type="text" name="username" required autofocus>
            <label>Mot de passe</label>
            <input type="password" name="password" required>
            <button type="submit">Se connecter</button>
        </form>
        <div class="lien-bas">
            Pas encore de compte ? <a href="{% url 'inscription' %}">Créer un nouveau compte</a>
        </div>
    </div>
</body>
</html>
